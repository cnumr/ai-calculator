name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Le "publish" de changesets/action attend une commande de publication npm ;
# ici on ne publie rien sur npm/PyPI, on se contente de créer le tag + la
# GitHub Release à partir du CHANGELOG.md généré par Changesets
# (scripts/create-release.mjs).

jobs:
  release:
    name: Version Packages / Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Create release PR or tag the release
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: node scripts/create-release.mjs
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
