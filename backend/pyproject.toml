[project]
name = "ai-calculator-backend"
version = "0.2.1"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi==0.139.0",
    "ecologits==0.11.1",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
