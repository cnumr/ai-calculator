server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte (écoconception, GreenIT RWEB_0076).
    # - Fichiers statiques : servis dans leur version .gz précompressée au
    #   build (gzip -9, une seule fois, voir Dockerfile.prod) : aucun calcul
    #   de compression par requête.
    # - Réponses de l'API (JSON) et fichiers sans .gz : compressés à la volée,
    #   à un niveau modéré (bon compromis entre gain réseau et CPU).
    # Les très petites réponses (< 1 Ko) ne gagnent rien à être compressées.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache navigateur (écoconception, GreenIT RWEB_0075).
    # - /assets/ : fichiers du build dont le nom contient un hash de leur
    #   contenu ; une nouvelle version change leur nom. Ils peuvent donc être
    #   gardés un an sans jamais être revérifiés (immutable). Un fichier absent
    #   renvoie 404 au lieu de index.html, pour ne pas mettre en cache une page
    #   HTML sous l'URL d'un asset.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # - index.html (et toutes les routes de l'application, qui le servent) :
    #   revérifié à chaque visite (no-cache), pour référencer les assets de la
    #   dernière version ; s'il n'a pas changé, nginx répond 304 sans le corps.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
