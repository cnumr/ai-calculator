services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      # Domaine public du site, pour le badge Ecoindex du pied de page : la prod
      # quand la variable n'est pas définie ; ECOINDEX_DOMAIN= (vide) : pas de badge.
      - ECOINDEX_DOMAIN=${ECOINDEX_DOMAIN-ai-calculator.greenit.eco}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
