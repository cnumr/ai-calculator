services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      # Domaine public du site, pour le badge Ecoindex du pied de page ; vide : pas de badge.
      - ECOINDEX_DOMAIN=${ECOINDEX_DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
